name: macOS Long-Running Workflow

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to start the first run manually

jobs:
  long_running_job:
    runs-on: getmac
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Keep-Alive Heartbeat
        run: |
          echo "Starting heartbeat..."
          end=$((SECONDS + 21600))
          while [ $SECONDS -lt $end ]; do
            echo "Workflow is still running... $(date)"
            sleep 5
          done

      - name: Run Main Task
        run: |
          echo "Starting main job..."
          sleep 21595
          echo "Main job completed."

      - name: Final Step
        run: echo "Workflow completed at $(date)"

      # This triggers the next run instantly using your LOOP_PAT token
      - name: Instant Rerun
        if: always() # Runs even if the tasks above fail or timeout
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.LOOP_PAT }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://github.com{{ github.repository }}/actions/workflows/loop.yml/dispatches \
            -d '{"ref":"main"}'
