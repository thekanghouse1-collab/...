name: macOS Long-Running Workflow test
on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows you to start the first run manually

jobs:
  long_running_job:
    # Target the getmac runner explicitly paired with macOS 26.5
    runs-on: [self-hosted, getmac, macos-26.5] 
    timeout-minutes: 1440
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Updated to v4 for better compatibility with newer macOS

      - name: Keep-Alive Heartbeat
        run: |
          echo "Starting heartbeat..."
          end=$((SECONDS + 86400))
          while [ $SECONDS -lt $end ]; do
            echo "Workflow is still running... $(date)"
            sleep 5
          done

      - name: Run Main Task
        run: |
          echo "Starting main job..."
          sleep 21595
